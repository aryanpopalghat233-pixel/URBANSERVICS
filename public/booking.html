<!DOCTYPE html>
<html>
<head>
<title>Book Service</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="uc-navbar">
<div class="left">
<div class="logo-box">UC</div>
<h2>UrbanService</h2>
</div>

<div class="form-container">
<h2>Book a Service</h2>

</div>

<script src="script.js"></script>
</body>
</html>
