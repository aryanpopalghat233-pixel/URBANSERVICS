<!DOCTYPE html>
<html>
<head>
<title>UrbanService</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
<div class="container nav">
<h2 class="logo">UrbanService</h2>
<nav>
<a href="services.html">Services</a>
<a href="tracking.html">Track</a>
<a href="worker.html">Become a Pro</a>
</nav>
</div>
</header>

<main class="container">

<section class="hero">
<h1>Home services, on demand</h1>
<p>Select a service to get started</p>
</section>

<!-- SERVICES -->
<section>
<h2>Popular Services</h2>
<div class="grid" id="serviceGrid"></div>
</section>

<!-- DETAIL TAB -->
<section id="serviceDetail" class="detail-tab" style="display:none;">
<button onclick="closeDetail()" class="back-btn">← Back</button>

<div class="detail-card">
<img id="dImg">

<div class="detail-info">
<h2 id="dName"></h2>
<p id="dDesc"></p>

<h3 class="price">₹<span id="dPrice"></span></h3>

<h3>Customer Reviews</h3>
<ul id="reviews"></ul>

<button class="btn" onclick="goToBooking()">Book Now</button>
</div>
</div>
</section>

</main>

<footer class="footer">
<p>© UrbanService</p>
</footer>

<script src="script.js"></script>
</body>
</html>
